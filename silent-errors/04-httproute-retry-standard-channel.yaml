# HTTPRoute retry (GEP-1731) is only in the EXPERIMENTAL channel of Gateway
# API v1.6. With the standard CRDs installed, the API server rejects this file
# under strict field validation (kubectl's default) and silently drops the
# retry block when validation is turned off: the route is created, without
# retries.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fraud-check
  namespace: payments
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: fraud-check
    port: 8080
  rules:
  - retry:
      attempts: 2
      codes: [503]
    timeouts:
      request: 2s
    backendRefs:
    - name: fraud-check
      port: 8080
