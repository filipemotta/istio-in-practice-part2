# Sidecar-mode namespace: every new pod gets an istio-proxy injected by the
# istiod mutating webhook.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-check
  namespace: payments
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-score
  namespace: payments
---
# payments-api is the caller. The "app" container is curl standing in for the
# service code: curl --max-time is the application timeout and curl --retry
# is the client library retry. The "load" container is fortio, used as a
# concurrent load generator (fortio load ...). Both share the pod's sidecar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        version: v1
    spec:
      serviceAccountName: payments-api
      containers:
      - name: app
        image: curlimages/curl:8.22.0
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      - name: load
        image: fortio/fortio:1.75.3
        # fortio's image has no shell; "server" keeps the container running so
        # "fortio load" can be exec'd into it. Its UI is not used.
        args: ["server", "-http-port", "9080", "-grpc-port", "disabled", "-redirect-port", "disabled", "-tcp-port", "disabled", "-udp-port", "disabled"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
# fraud-check: the dependency with controllable latency and error rate.
# fortio's echo server reads them from the query string of each request:
#   ?delay=2s            answer after 2 seconds
#   ?status=503:50       answer 503 half of the time
#   ?delay=1s:20         wait 1 second in 20% of the requests
# -loglevel Verbose logs one JSON line per request (url, status): that is how
# the lab counts the attempts that actually reached the service.
# -max-echo-delay raises fortio's 1.5s cap on delay=.
# Port 8090 is fraud-check calling its own dependency, risk-score: fortio's
# multi-server proxy (-M) forwards path, query string and headers (trace
# context included) to risk-score:8080 and returns its status. The fault
# injection step uses it to put the fault one hop below the policy under test.
apiVersion: v1
kind: Service
metadata:
  name: fraud-check
  namespace: payments
spec:
  selector:
    app: fraud-check
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: http-score
    port: 8090
    targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-check
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-check
      variant: healthy
  template:
    metadata:
      labels:
        app: fraud-check
        variant: healthy
        version: v1
    spec:
      serviceAccountName: fraud-check
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-loglevel", "Verbose", "-max-echo-delay", "30s", "-M", "8090 http://risk-score:8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /debug
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
# A degraded fraud-check replica, behind the same Service. It answers 503 to
# every request that carries no query string (-echo-server-default-params),
# while its readiness probe (/debug) keeps passing: Kubernetes keeps it in the
# endpoints, only outlier detection can take it out. Scaled to 1 by the
# outlier detection step, 0 otherwise.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-check-degraded
  namespace: payments
spec:
  replicas: 0
  selector:
    matchLabels:
      app: fraud-check
      variant: degraded
  template:
    metadata:
      labels:
        app: fraud-check
        variant: degraded
        version: v1
    spec:
      serviceAccountName: fraud-check
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-loglevel", "Verbose", "-max-echo-delay", "30s", "-echo-server-default-params", "status=503", "-M", "8090 http://risk-score:8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /debug
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
# risk-score: the dependency of fraud-check (a model scoring service). Same
# fortio echo server: latency and errors come from the query string.
apiVersion: v1
kind: Service
metadata:
  name: risk-score
  namespace: payments
spec:
  selector:
    app: risk-score
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-score
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-score
  template:
    metadata:
      labels:
        app: risk-score
        version: v1
    spec:
      serviceAccountName: risk-score
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-loglevel", "Verbose", "-max-echo-delay", "30s"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /debug
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
