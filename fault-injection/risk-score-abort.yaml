# Fault one hop below the policy under test: fraud-check's calls to
# risk-score fail with 503. The retry policy of payments-api -> fraud-check is
# what is being tested. Fault injection only exists in the Istio API.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: risk-score
  namespace: payments
spec:
  hosts:
  - risk-score
  http:
  - fault:
      abort:
        httpStatus: 503
        percentage:
          value: 100
    route:
    - destination:
        host: risk-score
