# Ambient: DestinationRule traffic policies are applied by the waypoint.
# The limit is per waypoint replica, not per client.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  host: fraud-check
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 2
      http:
        http1MaxPendingRequests: 1
