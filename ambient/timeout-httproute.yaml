# Ambient: the 1 second budget as an HTTPRoute attached to the fraud-check
# Service. The waypoint enforces it (HTTPRoute on waypoints is Beta in 1.31);
# without a waypoint, ztunnel is L4 only and the route would not be applied.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fraud-check
  namespace: payments-ambient
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: fraud-check
    port: 8080
  rules:
  - timeouts:
      request: 1s
    backendRefs:
    - name: fraud-check
      port: 8080
